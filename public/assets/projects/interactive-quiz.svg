<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad4)"/>

  <!-- Browser Window Frame -->
  <g transform="translate(60, 45)" filter="url(#shadow4)">
    <rect width="1080" height="660" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Browser Header / Navigation -->
    <rect width="1080" height="48" rx="14" fill="#1e293b"/>
    <rect y="38" width="1080" height="10" fill="#1e293b"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#334155" stroke-width="1"/>

    <circle cx="28" cy="24" r="6.5" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6.5" fill="#eab308"/>
    <circle cx="68" cy="24" r="6.5" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="110" y="8" width="580" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="130" y="29" font-family="'Geist', sans-serif" font-size="13" fill="#94a3b8">https://interactive-quiz-app-rosy.vercel.app/</text>

    <!-- App Top Bar Inside Browser -->
    <g transform="translate(0, 48)">
      <rect width="1080" height="55" fill="#1e293b" fill-opacity="0.6"/>
      <line x1="0" y1="55" x2="1080" y2="55" stroke="#334155" stroke-width="1"/>
      <text x="40" y="34" font-family="'Geist', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Code With AI</text>
      <!-- Dark Mode Button Mock -->
      <rect x="910" y="14" width="130" height="28" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="930" y="32" font-family="'Geist', sans-serif" font-size="12" font-weight="500" fill="#f8fafc">Dark Mode</text>
    </g>

    <!-- Quiz Main Card Container -->
    <g transform="translate(190, 140)">
      <rect width="700" height="480" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

      <!-- Card Top: Eyebrow & Title -->
      <text x="40" y="45" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">TEST YOUR KNOWLEDGE</text>
      <text x="40" y="78" font-family="'Geist', sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Code With AI Quiz</text>

      <!-- Progress Row -->
      <g transform="translate(40, 105)">
        <text x="0" y="16" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#94a3b8">Question 1 of 5</text>
        <text x="540" y="16" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8">Score: 1</text>
        <!-- Progress Track -->
        <rect x="0" y="28" width="620" height="6" rx="3" fill="#334155"/>
        <rect x="0" y="28" width="124" height="6" rx="3" fill="#38bdf8"/>
      </g>

      <!-- Question Text -->
      <text x="40" y="180" font-family="'Geist', sans-serif" font-size="17" font-weight="600" fill="#f8fafc">
        What is the primary benefit of writing unit tests before refactoring legacy code?
      </text>

      <!-- Option A -->
      <g transform="translate(40, 205)">
        <rect width="620" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <rect x="12" y="11" width="24" height="24" rx="4" fill="#334155"/>
        <text x="19" y="28" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8">A</text>
        <text x="48" y="29" font-family="'Geist', sans-serif" font-size="14" fill="#cbd5e1">It guarantees zero compiler warnings in strict mode.</text>
      </g>

      <!-- Option B (Correct / Active) -->
      <g transform="translate(40, 260)">
        <rect width="620" height="46" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
        <rect x="12" y="11" width="24" height="24" rx="4" fill="#10b981"/>
        <text x="19" y="28" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#022c22">B</text>
        <text x="48" y="29" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#a7f3d0">It establishes an automated regression boundary to prevent behavior drift.</text>
        <circle cx="595" cy="23" r="8" fill="#10b981"/>
        <path d="M591 23 l3 3 l6 -6" stroke="#022c22" stroke-width="2" fill="none"/>
      </g>

      <!-- Option C -->
      <g transform="translate(40, 315)">
        <rect width="620" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <rect x="12" y="11" width="24" height="24" rx="4" fill="#334155"/>
        <text x="19" y="28" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8">C</text>
        <text x="48" y="29" font-family="'Geist', sans-serif" font-size="14" fill="#cbd5e1">It completely eliminates the need for manual code reviews.</text>
      </g>

      <!-- Option D -->
      <g transform="translate(40, 370)">
        <rect width="620" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <rect x="12" y="11" width="24" height="24" rx="4" fill="#334155"/>
        <text x="19" y="28" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8">D</text>
        <text x="48" y="29" font-family="'Geist', sans-serif" font-size="14" fill="#cbd5e1">It automatically benchmarks memory allocations per iteration.</text>
      </g>

      <!-- Action Button: Next Question -->
      <g transform="translate(40, 430)">
        <rect x="470" y="0" width="150" height="38" rx="8" fill="#38bdf8"/>
        <text x="500" y="24" font-family="'Geist', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Next Question →</text>
      </g>
    </g>
  </g>
</svg>
