<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad2)"/>

  <!-- Window Container -->
  <g transform="translate(60, 45)" filter="url(#shadow2)">
    <rect width="1080" height="660" rx="14" fill="#141419" stroke="#262733" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="1080" height="48" rx="14" fill="#1b1c24"/>
    <rect y="38" width="1080" height="10" fill="#1b1c24"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#262733" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="28" cy="24" r="6.5" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6.5" fill="#eab308"/>
    <circle cx="68" cy="24" r="6.5" fill="#22c55e"/>

    <!-- Tab -->
    <rect x="110" y="8" width="260" height="40" rx="8" fill="#141419" stroke="#262733" stroke-width="1"/>
    <text x="135" y="29" font-family="'Geist Mono', monospace" font-size="13" font-weight="500" fill="#f4f1ee">test_grade_utilities.py</text>

    <!-- Subtitle / Status bar -->
    <text x="910" y="29" font-family="'Geist Mono', monospace" font-size="12" fill="#22c55e">● Red-Fix-Green Verified</text>

    <!-- Two-Panel Grid: Code Diff (Left) vs Unittest Terminal (Right) -->
    <!-- Left Panel: Code Diff -->
    <g transform="translate(35, 75)">
      <rect width="490" height="555" rx="10" fill="#181820" stroke="#262733" stroke-width="1"/>
      <!-- Header -->
      <rect width="490" height="38" rx="10" fill="#1f202b"/>
      <rect y="28" width="490" height="10" fill="#1f202b"/>
      <text x="20" y="25" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#9ca3af">SRC/GRADE_UTILITIES.PY (DIFF)</text>

      <!-- Diff lines -->
      <g transform="translate(20, 58)" font-family="'Geist Mono', monospace" font-size="13" line-height="22">
        <text y="20" fill="#71717a">@@ -12,4 +12,8 @@ def calculate_average(scores):</text>
        
        <!-- Red Deletion -->
        <rect x="-10" y="32" width="470" height="26" fill="#ef4444" fill-opacity="0.15"/>
        <text y="50" fill="#f87171">-   return sum(scores) / len(scores)</text>

        <!-- Green Additions -->
        <rect x="-10" y="66" width="470" height="80" fill="#22c55e" fill-opacity="0.15"/>
        <text y="84" fill="#4ade80">+   if not scores:</text>
        <text y="108" fill="#4ade80">+       raise ValueError("Empty scores list")</text>
        <text y="132" fill="#4ade80">+   return float(sum(scores)) / len(scores)</text>

        <!-- Neutral context -->
        <text y="174" fill="#9ca3af"> </text>
        <text y="196" fill="#ec4899">def <tspan fill="#60a5fa">is_pass</tspan>(score: <tspan fill="#34d399">float</tspan>) -&gt; <tspan fill="#34d399">bool</tspan>:</text>
        <rect x="-10" y="206" width="470" height="26" fill="#ef4444" fill-opacity="0.15"/>
        <text y="224" fill="#f87171">-   return score &gt; 50  # Bug: excluded 50</text>
        <rect x="-10" y="238" width="470" height="26" fill="#22c55e" fill-opacity="0.15"/>
        <text y="256" fill="#4ade80">+   return score &gt;= 50 # Fix: 50 is passing</text>

        <text y="300" fill="#71717a"># All grade boundaries validated</text>
        <text y="324" fill="#9ca3af">Grade A: score &gt;= 80</text>
        <text y="348" fill="#9ca3af">Grade B: 65 &lt;= score &lt; 80</text>
        <text y="372" fill="#9ca3af">Grade C: 50 &lt;= score &lt; 65</text>
        <text y="396" fill="#9ca3af">Grade F: score &lt; 50</text>
      </g>
    </g>

    <!-- Right Panel: Python Unittest Execution Terminal -->
    <g transform="translate(555, 75)">
      <rect width="490" height="555" rx="10" fill="#0f0f14" stroke="#262733" stroke-width="1"/>
      <!-- Header -->
      <rect width="490" height="38" rx="10" fill="#181822"/>
      <rect y="28" width="490" height="10" fill="#181822"/>
      <text x="20" y="25" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#9ca3af">TERMINAL (PYTHON -M UNITTEST)</text>

      <g transform="translate(20, 60)" font-family="'Geist Mono', monospace" font-size="13">
        <text y="20" fill="#9ca3af">$ <tspan fill="#f4f1ee">python -m unittest -v test_grade_utilities.py</tspan></text>
        
        <text y="60" fill="#9ca3af">test_average_valid_scores (test.TestGrades) ... <tspan fill="#22c55e" font-weight="700">ok</tspan></text>
        <text y="88" fill="#9ca3af">test_average_empty_list (test.TestGrades) ... <tspan fill="#22c55e" font-weight="700">ok</tspan></text>
        <text y="116" fill="#9ca3af">test_pass_mark_boundary (test.TestGrades) ... <tspan fill="#22c55e" font-weight="700">ok</tspan></text>
        <text y="144" fill="#9ca3af">test_grade_bracket_ordering (test.TestGrades) ... <tspan fill="#22c55e" font-weight="700">ok</tspan></text>
        <text y="172" fill="#9ca3af">test_invalid_score_types (test.TestGrades) ... <tspan fill="#22c55e" font-weight="700">ok</tspan></text>

        <!-- Divider line -->
        <line x1="0" y1="205" x2="450" y2="205" stroke="#262733" stroke-width="1"/>

        <text y="235" fill="#f4f1ee">Ran 5 tests in 0.003s</text>

        <!-- Success Banner -->
        <rect x="0" y="260" width="450" height="60" rx="8" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1"/>
        <text x="20" y="297" font-size="15" font-weight="700" fill="#4ade80">OK — All test assertions passed</text>

        <text y="365" fill="#71717a">Verification: RED (failing baseline) →</text>
        <text y="390" fill="#71717a">             FIX (root-cause correction) →</text>
        <text y="415" fill="#22c55e">             GREEN (validated &amp; regression safe)</text>
      </g>
    </g>
  </g>
</svg>
